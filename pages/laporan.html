<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - Absensi SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-cyan-50">
    <div id="sidebar"></div>
    <div id="navbar"></div>
    
    <div class="lg:ml-64 p-4 lg:p-8">
        <!-- Daily Report Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6 lg:p-8 mb-8 border border-gray-100">
            <div class="mb-8">
                <h3 class="text-3xl lg:text-4xl font-bold text-gray-800">Laporan Harian</h3>
                <p class="text-gray-500 mt-1">Abstraksi kehadiran siswa per hari</p>
            </div>
            
            <!-- Filter Section -->
            <div class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl p-5 lg:p-6 mb-6 border border-blue-100">
                <div class="flex flex-col sm:flex-row gap-3 lg:gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-gray-700 font-semibold mb-2 text-sm">Tanggal</label>
                        <input type="date" id="tanggalHarian" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white transition-all">
                    </div>
                    <div class="flex-1">
                        <label class="block text-gray-700 font-semibold mb-2 text-sm">Kelas</label>
                        <select id="kelasHarian" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white transition-all appearance-none cursor-pointer">
                            <option value="">Semua Kelas</option>
                            <option value="7A">7A</option>
                            <option value="7B">7B</option>
                            <option value="8A">8A</option>
                            <option value="8B">8B</option>
                            <option value="9A">9A</option>
                            <option value="9B">9B</option>
                        </select>
                    </div>
                    <button onclick="loadLaporanHarian()" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 text-white rounded-lg hover:shadow-lg hover:shadow-blue-500/30 transition-all font-medium">
                        Tampilkan
                    </button>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-2 mb-6">
                <button onclick="printLaporanHarian()" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-600 text-white rounded-lg hover:bg-slate-700 hover:shadow-lg transition-all text-xs lg:text-sm font-medium flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                    </svg>
                    Cetak
                </button>
                <button onclick="exportExcelHarian()" class="flex-1 sm:flex-none px-4 py-2.5 bg-green-600 text-white rounded-lg hover:bg-green-700 hover:shadow-lg transition-all text-xs lg:text-sm font-medium flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Excel
                </button>
                <button onclick="exportPDFHarian()" class="flex-1 sm:flex-none px-4 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 hover:shadow-lg transition-all text-xs lg:text-sm font-medium flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    PDF
                </button>
            </div>
            
            <!-- Table Section -->
            <div class="overflow-x-auto -mx-6 lg:mx-0 rounded-xl border border-gray-200 mb-6">
                <table class="w-full">
                    <thead class="bg-gradient-to-r from-gray-50 to-gray-100 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Kelas</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Total Siswa</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Hadir</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Izin</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Sakit</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Alpha</th>
                        </tr>
                    </thead>
                    <tbody id="laporanHarianTable" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-gray-200">
                <div class="text-sm text-gray-600">
                    Menampilkan <span id="showingStartHarian" class="font-semibold">0</span> - <span id="showingEndHarian" class="font-semibold">0</span> dari <span id="totalDataHarian" class="font-semibold">0</span> data
                </div>
                <div class="flex gap-2" id="paginationHarian"></div>
            </div>
        </div>
        
        <!-- Monthly Report Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6 lg:p-8 border border-gray-100">
            <div class="mb-8">
                <h3 class="text-3xl lg:text-4xl font-bold text-gray-800">Laporan Bulanan</h3>
                <p class="text-gray-500 mt-1">Detail kehadiran siswa per bulan</p>
            </div>
            
            <!-- Filter Section -->
            <div class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl p-5 lg:p-6 mb-6 border border-blue-100">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2 text-sm">Bulan</label>
                        <select id="bulan" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white transition-all appearance-none cursor-pointer">
                            <option value="1">Januari</option>
                            <option value="2">Februari</option>
                            <option value="3">Maret</option>
                            <option value="4">April</option>
                            <option value="5">Mei</option>
                            <option value="6">Juni</option>
                            <option value="7">Juli</option>
                            <option value="8">Agustus</option>
                            <option value="9">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">Desember</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2 text-sm">Tahun</label>
                        <input type="number" id="tahun" value="2024" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white transition-all">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2 text-sm">Kelas</label>
                        <select id="kelasBulanan" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white transition-all appearance-none cursor-pointer">
                            <option value="">Semua Kelas</option>
                            <option value="7A">7A</option>
                            <option value="7B">7B</option>
                            <option value="8A">8A</option>
                            <option value="8B">8B</option>
                            <option value="9A">9A</option>
                            <option value="9B">9B</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="loadLaporanBulanan()" class="w-full px-6 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 text-white rounded-lg hover:shadow-lg hover:shadow-blue-500/30 transition-all font-medium">
                            Tampilkan
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-2 mb-6">
                <button onclick="printLaporanBulanan()" class="flex-1 sm:flex-none px-4 py-2.5 bg-slate-600 text-white rounded-lg hover:bg-slate-700 hover:shadow-lg transition-all text-xs lg:text-sm font-medium flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                    </svg>
                    Cetak
                </button>
                <button onclick="exportExcelBulanan()" class="flex-1 sm:flex-none px-4 py-2.5 bg-green-600 text-white rounded-lg hover:bg-green-700 hover:shadow-lg transition-all text-xs lg:text-sm font-medium flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Excel
                </button>
                <button onclick="exportPDFBulanan()" class="flex-1 sm:flex-none px-4 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 hover:shadow-lg transition-all text-xs lg:text-sm font-medium flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    PDF
                </button>
            </div>
            
            <!-- Table Section -->
            <div class="overflow-x-auto -mx-6 lg:mx-0 rounded-xl border border-gray-200 mb-6">
                <table class="w-full">
                    <thead class="bg-gradient-to-r from-gray-50 to-gray-100 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">NIS</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Nama Siswa</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Kelas</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Hadir</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Izin</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Sakit</th>
                            <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Alpha</th>
                        </tr>
                    </thead>
                    <tbody id="laporanBulananTable" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-gray-200">
                <div class="text-sm text-gray-600">
                    Menampilkan <span id="showingStartBulanan" class="font-semibold">0</span> - <span id="showingEndBulanan" class="font-semibold">0</span> dari <span id="totalDataBulanan" class="font-semibold">0</span> data
                </div>
                <div class="flex gap-2" id="paginationBulanan"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from '../assets/js/auth.js';
        import { api } from '../assets/js/api.js';
        import { renderSidebar } from '../assets/components/sidebar.js';
        import { renderNavbar } from '../assets/components/navbar.js';
        import { showToast } from '../assets/components/toast.js';
        import { formatDate } from '../assets/js/utils.js';

        checkAuth();

        document.getElementById('sidebar').innerHTML = renderSidebar();
        document.getElementById('navbar').innerHTML = renderNavbar();
        document.getElementById('pageTitle').textContent = 'Laporan';
        
        const today = new Date();
        document.getElementById('tanggalHarian').value = formatDate(today);
        document.getElementById('bulan').value = today.getMonth() + 1;
        document.getElementById('tahun').value = today.getFullYear();

        let currentPageHarian = 1;
        let currentPageBulanan = 1;
        const limit = 10;

        window.loadLaporanHarian = async (page = 1) => {
            currentPageHarian = page;
            const tanggal = document.getElementById('tanggalHarian').value;
            const kelas = document.getElementById('kelasHarian').value;
            const params = `?tanggal=${tanggal}&kelas=${kelas}`;
            
            try {
                const response = await api.getLaporanHarian(params);
                const allData = response.data;
                const total = allData.length;
                const offset = (page - 1) * limit;
                const data = allData.slice(offset, offset + limit);
                
                const tbody = document.getElementById('laporanHarianTable');
                tbody.innerHTML = '';
                
                let totalSiswa = 0, totalHadir = 0, totalIzin = 0, totalSakit = 0, totalAlpha = 0;
                
                allData.forEach(item => {
                    totalSiswa += parseInt(item.total_siswa);
                    totalHadir += parseInt(item.hadir || 0);
                    totalIzin += parseInt(item.izin || 0);
                    totalSakit += parseInt(item.sakit || 0);
                    totalAlpha += parseInt(item.alpha || 0);
                });
                
                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50/50 transition-colors border-b border-gray-100 last:border-b-0">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">${item.kelas}</td>
                            <td class="px-6 py-4 text-sm text-gray-700">${item.total_siswa}</td>
                            <td class="px-6 py-4 text-sm text-green-600 font-bold">${item.hadir || 0}</td>
                            <td class="px-6 py-4 text-sm text-blue-600 font-bold">${item.izin || 0}</td>
                            <td class="px-6 py-4 text-sm text-yellow-600 font-bold">${item.sakit || 0}</td>
                            <td class="px-6 py-4 text-sm text-red-600 font-bold">${item.alpha || 0}</td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML += `
                    <tr class="bg-gradient-to-r from-gray-100 to-gray-50 font-bold border-t-2 border-gray-300">
                        <td class="px-6 py-4 text-sm text-gray-900">TOTAL</td>
                        <td class="px-6 py-4 text-sm text-gray-900">${totalSiswa}</td>
                        <td class="px-6 py-4 text-sm text-green-600">${totalHadir}</td>
                        <td class="px-6 py-4 text-sm text-blue-600">${totalIzin}</td>
                        <td class="px-6 py-4 text-sm text-yellow-600">${totalSakit}</td>
                        <td class="px-6 py-4 text-sm text-red-600">${totalAlpha}</td>
                    </tr>
                `;
                
                // Update pagination info
                const start = total > 0 ? offset + 1 : 0;
                const end = Math.min(offset + limit, total);
                document.getElementById('showingStartHarian').textContent = start;
                document.getElementById('showingEndHarian').textContent = end;
                document.getElementById('totalDataHarian').textContent = total;
                
                // Render pagination
                const totalPages = Math.ceil(total / limit);
                const paginationDiv = document.getElementById('paginationHarian');
                paginationDiv.innerHTML = '';
                
                if (totalPages > 1) {
                    if (page > 1) {
                        paginationDiv.innerHTML += `<button onclick="loadLaporanHarian(${page - 1})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">Prev</button>`;
                    }
                    for (let i = 1; i <= totalPages; i++) {
                        if (i === page) {
                            paginationDiv.innerHTML += `<button class="px-3 py-1 bg-green-600 text-white rounded text-sm">${i}</button>`;
                        } else if (i === 1 || i === totalPages || (i >= page - 1 && i <= page + 1)) {
                            paginationDiv.innerHTML += `<button onclick="loadLaporanHarian(${i})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">${i}</button>`;
                        } else if (i === page - 2 || i === page + 2) {
                            paginationDiv.innerHTML += `<span class="px-2">...</span>`;
                        }
                    }
                    if (page < totalPages) {
                        paginationDiv.innerHTML += `<button onclick="loadLaporanHarian(${page + 1})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">Next</button>`;
                    }
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
        };

        window.loadLaporanBulanan = async (page = 1) => {
            currentPageBulanan = page;
            const bulan = document.getElementById('bulan').value;
            const tahun = document.getElementById('tahun').value;
            const kelas = document.getElementById('kelasBulanan').value;
            const params = `?bulan=${bulan}&tahun=${tahun}&kelas=${kelas}`;
            
            try {
                const response = await api.getLaporanBulanan(params);
                const allData = response.data;
                const total = allData.length;
                const offset = (page - 1) * limit;
                const data = allData.slice(offset, offset + limit);
                
                const tbody = document.getElementById('laporanBulananTable');
                tbody.innerHTML = '';
                
                let totalHadir = 0, totalIzin = 0, totalSakit = 0, totalAlpha = 0;
                
                allData.forEach(item => {
                    totalHadir += parseInt(item.hadir || 0);
                    totalIzin += parseInt(item.izin || 0);
                    totalSakit += parseInt(item.sakit || 0);
                    totalAlpha += parseInt(item.alpha || 0);
                });
                
                data.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50/50 transition-colors border-b border-gray-100 last:border-b-0">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">${item.nis}</td>
                            <td class="px-6 py-4 text-sm text-gray-700">${item.nama_lengkap}</td>
                            <td class="px-6 py-4 text-sm text-gray-700">
                                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-700">
                                    ${item.kelas}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-sm text-green-600 font-bold">${item.hadir || 0}</td>
                            <td class="px-6 py-4 text-sm text-blue-600 font-bold">${item.izin || 0}</td>
                            <td class="px-6 py-4 text-sm text-yellow-600 font-bold">${item.sakit || 0}</td>
                            <td class="px-6 py-4 text-sm text-red-600 font-bold">${item.alpha || 0}</td>
                        </tr>
                    `;
                });
                
                tbody.innerHTML += `
                    <tr class="bg-gradient-to-r from-gray-100 to-gray-50 font-bold border-t-2 border-gray-300">
                        <td colspan="3" class="px-6 py-4 text-sm text-gray-900 text-right">TOTAL</td>
                        <td class="px-6 py-4 text-sm text-green-600">${totalHadir}</td>
                        <td class="px-6 py-4 text-sm text-blue-600">${totalIzin}</td>
                        <td class="px-6 py-4 text-sm text-yellow-600">${totalSakit}</td>
                        <td class="px-6 py-4 text-sm text-red-600">${totalAlpha}</td>
                    </tr>
                `;
                
                // Update pagination info
                const start = total > 0 ? offset + 1 : 0;
                const end = Math.min(offset + limit, total);
                document.getElementById('showingStartBulanan').textContent = start;
                document.getElementById('showingEndBulanan').textContent = end;
                document.getElementById('totalDataBulanan').textContent = total;
                
                // Render pagination
                const totalPages = Math.ceil(total / limit);
                const paginationDiv = document.getElementById('paginationBulanan');
                paginationDiv.innerHTML = '';
                
                if (totalPages > 1) {
                    if (page > 1) {
                        paginationDiv.innerHTML += `<button onclick="loadLaporanBulanan(${page - 1})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">Prev</button>`;
                    }
                    for (let i = 1; i <= totalPages; i++) {
                        if (i === page) {
                            paginationDiv.innerHTML += `<button class="px-3 py-1 bg-green-600 text-white rounded text-sm">${i}</button>`;
                        } else if (i === 1 || i === totalPages || (i >= page - 1 && i <= page + 1)) {
                            paginationDiv.innerHTML += `<button onclick="loadLaporanBulanan(${i})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">${i}</button>`;
                        } else if (i === page - 2 || i === page + 2) {
                            paginationDiv.innerHTML += `<span class="px-2">...</span>`;
                        }
                    }
                    if (page < totalPages) {
                        paginationDiv.innerHTML += `<button onclick="loadLaporanBulanan(${page + 1})" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">Next</button>`;
                    }
                }
            } catch (error) {
                showToast(error.message, 'error');
            }
        };

        // Print Laporan Harian
        window.printLaporanHarian = () => {
            const tanggal = document.getElementById('tanggalHarian').value;
            const kelas = document.getElementById('kelasHarian').value;
            const table = document.getElementById('laporanHarianTable').innerHTML;
            
            const printWindow = window.open('', '', 'width=800,height=600');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Laporan Harian Absensi</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; }
                        h2 { text-align: center; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
                        th { background-color: #f0f0f0; }
                        .total-row { background-color: #e0e0e0; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <h2>Laporan Absensi Harian</h2>
                    <p>Tanggal: ${tanggal}</p>
