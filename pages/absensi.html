<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi - Absensi SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-cyan-50">
    <div id="sidebar"></div>
    <div id="navbar"></div>
    
    <div class="lg:ml-64 p-4 lg:p-8">
        <div class="bg-white rounded-2xl shadow-lg p-6 lg:p-8 border border-gray-100">
            <div class="mb-8">
                <h3 class="text-3xl lg:text-4xl font-bold text-gray-800 mb-2">Input Absensi</h3>
                <p class="text-gray-500">Pilih kelas dan tanggal untuk memulai pencatatan kehadiran</p>
            </div>
            
            <!-- Filter Section -->
            <div class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl p-4 sm:p-6 lg:p-8 mb-8 border border-blue-100">
                <div class="flex flex-col gap-3 sm:gap-4 lg:gap-6 sm:flex-row sm:items-end lg:items-end">
                    <div class="flex-1 min-w-0">
                        <label class="block text-gray-700 font-semibold mb-2 sm:mb-3 text-xs sm:text-sm lg:text-base">Tanggal</label>
                        <input type="date" id="tanggal" class="w-full px-3 sm:px-4 py-2 sm:py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-xs sm:text-sm lg:text-base transition-all">
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="block text-gray-700 font-semibold mb-2 sm:mb-3 text-xs sm:text-sm lg:text-base">Kelas</label>
                        <select id="kelas" class="w-full px-3 sm:px-4 py-2 sm:py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-xs sm:text-sm lg:text-base transition-all appearance-none cursor-pointer">
                            <option value="">Pilih Kelas</option>
                            <option value="7A">7A</option>
                            <option value="7B">7B</option>
                            <option value="8A">8A</option>
                            <option value="8B">8B</option>
                            <option value="9A">9A</option>
                            <option value="9B">9B</option>
                        </select>
                    </div>
                    <button onclick="loadSiswa()" class="w-full sm:w-auto px-6 py-2.5 sm:py-3 bg-gradient-to-r from-blue-600 to-cyan-500 text-white rounded-lg hover:shadow-lg hover:shadow-blue-500/30 transition-all font-medium whitespace-nowrap text-sm sm:text-base">
                        🔍 Tampilkan
                    </button>
                </div>
            </div>
            
            <!-- Student List Section -->
            <div id="siswaList" class="hidden">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
                    <div>
                        <h4 class="text-2xl font-bold text-gray-800">Daftar Siswa</h4>
                        <p class="text-gray-500 text-sm mt-1">Pilih status kehadiran untuk setiap siswa</p>
                    </div>
                    <button onclick="simpanAbsensi()" class="px-6 lg:px-8 py-3 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-lg hover:shadow-lg hover:shadow-emerald-500/30 transition-all font-medium hidden sm:block">
                        💾 Simpan Absensi
                    </button>
                </div>
                
                <div class="overflow-x-auto -mx-6 lg:mx-0 rounded-xl border border-gray-200">
                    <table class="w-full">
                        <thead class="bg-gradient-to-r from-gray-50 to-gray-100 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Nama Siswa</th>
                                <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-4 text-left text-xs lg:text-sm font-bold text-gray-700 uppercase tracking-wider">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="siswaTable" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>

                <!-- Mobile Save Button -->
                <button onclick="simpanAbsensi()" class="w-full mt-6 px-6 py-3 bg-gradient-to-r from-emerald-500 to-green-600 text-white rounded-lg hover:shadow-lg hover:shadow-emerald-500/30 transition-all font-medium sm:hidden">
                    💾 Simpan Absensi
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from '../assets/js/auth.js';
        import { api } from '../assets/js/api.js';
        import { renderSidebar } from '../assets/components/sidebar.js';
        import { renderNavbar } from '../assets/components/navbar.js';
        import { showToast } from '../assets/components/toast.js';
        import { formatDate } from '../assets/js/utils.js';

        checkAuth();

        document.getElementById('sidebar').innerHTML = renderSidebar();
        document.getElementById('navbar').innerHTML = renderNavbar();
        document.getElementById('pageTitle').textContent = 'Absensi';
        document.getElementById('tanggal').value = formatDate(new Date());

        let siswaData = [];
        let absensiData = {};

        window.loadSiswa = async () => {
            const kelas = document.getElementById('kelas').value;
            const tanggal = document.getElementById('tanggal').value;
            
            if (!kelas) {
                showToast('Pilih kelas terlebih dahulu', 'error');
                return;
            }

            if (!tanggal) {
                showToast('Pilih tanggal terlebih dahulu', 'error');
                return;
            }
            
            try {
                // Fetch siswa data
                const siswaResponse = await api.getSiswa(`?kelas=${kelas}&status=aktif`);
                siswaData = siswaResponse.data.data;
                
                // Fetch existing attendance data for the selected date and class
                const absensiResponse = await api.getAbsensi(`?tanggal=${tanggal}&kelas=${kelas}`);
                
                // Create a map of existing attendance data by siswa_id
                absensiData = {};
                if (absensiResponse.data && Array.isArray(absensiResponse.data)) {
                    absensiResponse.data.forEach(absensi => {
                        absensiData[absensi.siswa_id] = {
                            id: absensi.id,
                            status: absensi.status,
                            keterangan: absensi.keterangan || ''
                        };
                    });
                }
                
                const tbody = document.getElementById('siswaTable');
                tbody.innerHTML = '';
                
                siswaData.forEach(siswa => {
                    // Get saved data if exists, otherwise use default
                    const saved = absensiData[siswa.id];
                    const status = saved ? saved.status : 'hadir';
                    const keterangan = saved ? saved.keterangan : '';
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50 transition-colors border-b border-gray-100 last:border-b-0">
                            <td class="px-6 py-4 text-sm text-gray-700">${siswa.nama_lengkap}</td>
                            <td class="px-6 py-4">
                                <div class="flex flex-wrap gap-2 lg:gap-2.5">
                                    <!-- Hadir Checkbox -->
                                    <label class="status-label flex items-center gap-2 px-3.5 py-2 rounded-lg cursor-pointer transition-all ${status === 'hadir' ? 'bg-green-100 border-2 border-green-500 shadow-md shadow-green-200' : 'bg-gray-50 border-2 border-gray-200 hover:bg-green-50 hover:border-green-300'} group" data-status="hadir" data-siswa-id="${siswa.id}">
                                        <input type="radio" name="status-${siswa.id}" value="hadir" class="status-radio w-5 h-5 accent-green-600 cursor-pointer hidden" data-siswa-id="${siswa.id}" ${status === 'hadir' ? 'checked' : ''}>
                                        <span class="font-semibold text-sm ${status === 'hadir' ? 'text-green-700' : 'text-gray-600 group-hover:text-green-600'}">✓ Hadir</span>
                                    </label>
                                    <!-- Izin Checkbox -->
                                    <label class="status-label flex items-center gap-2 px-3.5 py-2 rounded-lg cursor-pointer transition-all ${status === 'izin' ? 'bg-blue-100 border-2 border-blue-500 shadow-md shadow-blue-200' : 'bg-gray-50 border-2 border-gray-200 hover:bg-blue-50 hover:border-blue-300'} group" data-status="izin" data-siswa-id="${siswa.id}">
                                        <input type="radio" name="status-${siswa.id}" value="izin" class="status-radio w-5 h-5 accent-blue-600 cursor-pointer hidden" data-siswa-id="${siswa.id}" ${status === 'izin' ? 'checked' : ''}>
                                        <span class="font-semibold text-sm ${status === 'izin' ? 'text-blue-700' : 'text-gray-600 group-hover:text-blue-600'}">📋 Izin</span>
                                    </label>
                                    <!-- Sakit Checkbox -->
                                    <label class="status-label flex items-center gap-2 px-3.5 py-2 rounded-lg cursor-pointer transition-all ${status === 'sakit' ? 'bg-yellow-100 border-2 border-yellow-500 shadow-md shadow-yellow-200' : 'bg-gray-50 border-2 border-gray-200 hover:bg-yellow-50 hover:border-yellow-300'} group" data-status="sakit" data-siswa-id="${siswa.id}">
                                        <input type="radio" name="status-${siswa.id}" value="sakit" class="status-radio w-5 h-5 accent-yellow-500 cursor-pointer hidden" data-siswa-id="${siswa.id}" ${status === 'sakit' ? 'checked' : ''}>
                                        <span class="font-semibold text-sm ${status === 'sakit' ? 'text-yellow-700' : 'text-gray-600 group-hover:text-yellow-600'}">🤒 Sakit</span>
                                    </label>
                                    <!-- Alpha Checkbox -->
                                    <label class="status-label flex items-center gap-2 px-3.5 py-2 rounded-lg cursor-pointer transition-all ${status === 'alpha' ? 'bg-red-100 border-2 border-red-500 shadow-md shadow-red-200' : 'bg-gray-50 border-2 border-gray-200 hover:bg-red-50 hover:border-red-300'} group" data-status="alpha" data-siswa-id="${siswa.id}">
                                        <input type="radio" name="status-${siswa.id}" value="alpha" class="status-radio w-5 h-5 accent-red-600 cursor-pointer hidden" data-siswa-id="${siswa.id}" ${status === 'alpha' ? 'checked' : ''}>
                                        <span class="font-semibold text-sm ${status === 'alpha' ? 'text-red-700' : 'text-gray-600 group-hover:text-red-600'}">✗ Alpha</span>
                                    </label>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <input type="text" class="keterangan-input px-3 py-2 border border-gray-200 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" 
                                    data-siswa-id="${siswa.id}" placeholder="Masukkan keterangan..." value="${keterangan}">
                            </td>
                        </tr>
                    `;
                });
                
                // Add event listeners to status labels
                attachStatusEventListeners();
                
                document.getElementById('siswaList').classList.remove('hidden');
            } catch (error) {
                showToast(error.message, 'error');
            }
        };

        // Function to handle status selection and UI updates
        const attachStatusEventListeners = () => {
            const statusLabels = document.querySelectorAll('.status-label');
            
            statusLabels.forEach(label => {
                label.addEventListener('click', (e) => {
                    const siswaId = label.getAttribute('data-siswa-id');
                    const newStatus = label.getAttribute('data-status');
                    
                    // Update the radio button
                    const radio = label.querySelector('input[type="radio"]');
                    if (radio) {
                        radio.checked = true;
                    }
                    
                    // Update absensiData
                    if (!absensiData[siswaId]) {
                        absensiData[siswaId] = {};
                    }
                    absensiData[siswaId].status = newStatus;
                    
                    // Update all status labels for this student
                    const tr = label.closest('tr');
                    const allLabels = tr.querySelectorAll('.status-label');
                    
                    allLabels.forEach(lbl => {
                        const status = lbl.getAttribute('data-status');
                        lbl.classList.remove(
                            'bg-green-100', 'border-green-500', 'shadow-md', 'shadow-green-200',
                            'bg-blue-100', 'border-blue-500', 'shadow-blue-200',
                            'bg-yellow-100', 'border-yellow-500', 'shadow-yellow-200',
                            'bg-red-100', 'border-red-500', 'shadow-red-200'
                        );
                        lbl.classList.add('bg-gray-50', 'border-gray-200', 'hover:bg-gray-100', 'hover:border-gray-300');
                        
                        const span = lbl.querySelector('span');
                        span.classList.remove('text-green-700', 'text-blue-700', 'text-yellow-700', 'text-red-700');
                        span.classList.add('text-gray-600');
                    });
                    
                    // Highlight selected label
                    switch (newStatus) {
                        case 'hadir':
                            label.classList.remove('bg-gray-50', 'border-gray-200', 'hover:bg-gray-100', 'hover:border-gray-300');
                            label.classList.add('bg-green-100', 'border-2', 'border-green-500', 'shadow-md', 'shadow-green-200');
                            label.querySelector('span').classList.add('text-green-700');
                            break;
                        case 'izin':
                            label.classList.remove('bg-gray-50', 'border-gray-200', 'hover:bg-gray-100', 'hover:border-gray-300');
                            label.classList.add('bg-blue-100', 'border-2', 'border-blue-500', 'shadow-md', 'shadow-blue-200');
                            label.querySelector('span').classList.add('text-blue-700');
                            break;
                        case 'sakit':
                            label.classList.remove('bg-gray-50', 'border-gray-200', 'hover:bg-gray-100', 'hover:border-gray-300');
                            label.classList.add('bg-yellow-100', 'border-2', 'border-yellow-500', 'shadow-md', 'shadow-yellow-200');
                            label.querySelector('span').classList.add('text-yellow-700');
                            break;
                        case 'alpha':
                            label.classList.remove('bg-gray-50', 'border-gray-200', 'hover:bg-gray-100', 'hover:border-gray-300');
                            label.classList.add('bg-red-100', 'border-2', 'border-red-500', 'shadow-md', 'shadow-red-200');
                            label.querySelector('span').classList.add('text-red-700');
                            break;
                    }
                });
            });
        };

        window.simpanAbsensi = async () => {
            const tanggal = document.getElementById('tanggal').value;
            
            if (!tanggal) {
                showToast('Pilih tanggal terlebih dahulu', 'error');
                return;
            }
            
            const statusRadios = document.querySelectorAll('.status-radio:checked');
            const keteranganInputs = document.querySelectorAll('.keterangan-input');
            
            const promises = [];
            
            statusRadios.forEach((radio) => {
                const siswaId = radio.getAttribute('data-siswa-id');
                const status = radio.value;
                const keteranganInput = document.querySelector(`.keterangan-input[data-siswa-id="${siswaId}"]`);
                const keterangan = keteranganInput ? keteranganInput.value : '';
                
                // Check if attendance already exists
                if (absensiData[siswaId]) {
                    // Update existing attendance
                    if (absensiData[siswaId].id) {
                        promises.push(api.updateAbsensi(absensiData[siswaId].id, {
                            status: status,
                            keterangan: keterangan
                        }));
                    }
                } else {
                    // Create new attendance
                    promises.push(api.createAbsensi({
                        siswa_id: siswaId,
                        tanggal: tanggal,
                        status: status,
                        keterangan: keterangan
                    }));
                }
            });
            
            try {
                await Promise.all(promises);
                showToast('Absensi berhasil disimpan');
                document.getElementById('siswaList').classList.add('hidden');
                document.getElementById('kelas').value = '';
            } catch (error) {
                showToast(error.message, 'error');
            }
        };
    </script>
</body>
</html>
