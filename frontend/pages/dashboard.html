<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Absensi SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-cyan-50 min-h-screen">
    <div id="sidebar"></div>
    <div id="navbar"></div>
    
    <div class="lg:ml-64 p-4 lg:p-8">
        <!-- Stats Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 lg:gap-6 mb-8">
            <!-- Total Siswa Card -->
            <div class="group relative bg-white rounded-2xl shadow-lg p-6 lg:p-7 hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 border border-gray-100">
                <div class="absolute inset-0 bg-gradient-to-br from-blue-500/10 to-transparent rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-xs lg:text-sm font-medium uppercase tracking-wide">Total Siswa</p>
                        <h3 class="text-4xl lg:text-5xl font-bold text-gray-800 mt-2" id="totalSiswa">0</h3>
                    </div>
                    <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-3 lg:p-4 rounded-xl shadow-lg group-hover:shadow-xl transition-all">
                        <svg class="w-8 h-8 lg:w-10 lg:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Hadir Hari Ini Card -->
            <div class="group relative bg-white rounded-2xl shadow-lg p-6 lg:p-7 hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 border border-gray-100">
                <div class="absolute inset-0 bg-gradient-to-br from-green-500/10 to-transparent rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-xs lg:text-sm font-medium uppercase tracking-wide">Hadir Hari Ini</p>
                        <h3 class="text-4xl lg:text-5xl font-bold text-green-600 mt-2" id="hadirHariIni">0</h3>
                    </div>
                    <div class="bg-gradient-to-br from-green-500 to-emerald-600 p-3 lg:p-4 rounded-xl shadow-lg group-hover:shadow-xl transition-all">
                        <svg class="w-8 h-8 lg:w-10 lg:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Alpha Hari Ini Card -->
            <div class="group relative bg-white rounded-2xl shadow-lg p-6 lg:p-7 hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 border border-gray-100">
                <div class="absolute inset-0 bg-gradient-to-br from-red-500/10 to-transparent rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-xs lg:text-sm font-medium uppercase tracking-wide">Alpha Hari Ini</p>
                        <h3 class="text-4xl lg:text-5xl font-bold text-red-600 mt-2" id="alphaHariIni">0</h3>
                    </div>
                    <div class="bg-gradient-to-br from-red-500 to-rose-600 p-3 lg:p-4 rounded-xl shadow-lg group-hover:shadow-xl transition-all">
                        <svg class="w-8 h-8 lg:w-10 lg:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Total Guru Card -->
            <div class="group relative bg-white rounded-2xl shadow-lg p-6 lg:p-7 hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 border border-gray-100">
                <div class="absolute inset-0 bg-gradient-to-br from-purple-500/10 to-transparent rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-xs lg:text-sm font-medium uppercase tracking-wide">Total Guru</p>
                        <h3 class="text-4xl lg:text-5xl font-bold text-purple-600 mt-2" id="totalGuru">0</h3>
                    </div>
                    <div class="bg-gradient-to-br from-purple-500 to-pink-600 p-3 lg:p-4 rounded-xl shadow-lg group-hover:shadow-xl transition-all">
                        <svg class="w-8 h-8 lg:w-10 lg:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Chart Section -->
        <div class="bg-white rounded-2xl shadow-lg p-6 lg:p-8 border border-gray-100">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h3 class="text-2xl lg:text-3xl font-bold text-gray-800">Grafik Absensi</h3>
                    <p class="text-gray-500 text-sm mt-1">Statistik kehadiran mingguan</p>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <input type="date" id="startDate" class="px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                    <span class="hidden sm:flex items-center text-gray-400">–</span>
                    <input type="date" id="endDate" class="px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50">
                    <button onclick="loadChart()" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 text-white rounded-lg hover:shadow-lg hover:shadow-blue-500/30 transition-all font-medium">
                        Perbarui
                    </button>
                </div>
            </div>
            <div class="relative h-96">
                <canvas id="chartAbsensi"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from '../assets/js/auth.js';
        import { api } from '../assets/js/api.js';
        import { renderSidebar } from '../assets/components/sidebar.js';
        import { renderNavbar } from '../assets/components/navbar.js';
        import { showToast } from '../assets/components/toast.js';
        import { formatDate } from '../assets/js/utils.js';

        checkAuth();

        document.getElementById('sidebar').innerHTML = renderSidebar();
        document.getElementById('navbar').innerHTML = renderNavbar();
        document.getElementById('pageTitle').textContent = 'Dashboard';

        // Set default date range (last 7 days)
        const today = new Date();
        const lastWeek = new Date(today);
        lastWeek.setDate(today.getDate() - 6);
        document.getElementById('startDate').value = formatDate(lastWeek);
        document.getElementById('endDate').value = formatDate(today);

        let chartInstance = null;

        const loadStatistik = async () => {
            try {
                const response = await api.getStatistik();
                const data = response.data;
                
                document.getElementById('totalSiswa').textContent = data.total_siswa;
                document.getElementById('hadirHariIni').textContent = data.hadir_hari_ini;
                document.getElementById('alphaHariIni').textContent = data.alpha_hari_ini;
                document.getElementById('totalGuru').textContent = data.total_guru;
            } catch (error) {
                showToast(error.message, 'error');
            }
        };

        window.loadChart = async () => {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!startDate || !endDate) {
                showToast('Pilih tanggal mulai dan akhir', 'error');
                return;
            }
            
            try {
                const dates = [];
                const hadirData = [];
                const izinData = [];
                const sakitData = [];
                const alphaData = [];
                
                const start = new Date(startDate);
                const end = new Date(endDate);
                
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    const dateStr = formatDate(d);
                    dates.push(dateStr);
                    
                    const response = await api.getLaporanHarian(`?tanggal=${dateStr}`);
                    let hadir = 0, izin = 0, sakit = 0, alpha = 0;
                    
                    response.data.forEach(item => {
                        hadir += parseInt(item.hadir || 0);
                        izin += parseInt(item.izin || 0);
                        sakit += parseInt(item.sakit || 0);
                        alpha += parseInt(item.alpha || 0);
                    });
                    
                    hadirData.push(hadir);
                    izinData.push(izin);
                    sakitData.push(sakit);
                    alphaData.push(alpha);
                }
                
                if (chartInstance) {
                    chartInstance.destroy();
                }
                
                const ctx = document.getElementById('chartAbsensi').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Hadir',
                            data: hadirData,
                            backgroundColor: 'rgba(16, 185, 129, 0.8)'
                        }, {
                            label: 'Izin',
                            data: izinData,
                            backgroundColor: 'rgba(59, 130, 246, 0.8)'
                        }, {
                            label: 'Sakit',
                            data: sakitData,
                            backgroundColor: 'rgba(251, 191, 36, 0.8)'
                        }, {
                            label: 'Alpha',
                            data: alphaData,
                            backgroundColor: 'rgba(239, 68, 68, 0.8)'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            } catch (error) {
                showToast(error.message, 'error');
            }
        };

        loadStatistik();
        loadChart();
    </script>
</body>
</html>
